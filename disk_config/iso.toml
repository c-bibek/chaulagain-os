# Chaulagain OS installer (Anaconda ISO)
#
# Update channel: after installing, the computer follows
# ghcr.io/c-bibek/chaulagain-os:<channel> for over-the-air updates.
# @CHANNEL@ is filled in by the "Build disk images" workflow (testing or
# stable), so this file can't be used for a local build as it is.
#
# Disk format: Btrfs, which the planned Time Machine-style snapshots need.
# The image declares it (/usr/lib/bootc/install/00-chaulagain-os.toml), the
# workflow passes --rootfs btrfs, and Fedora's installer uses Btrfs when you
# keep "Automatic" storage configuration. docs/install-hyperv.md shows how
# to check after installing.
[customizations.installer.kickstart]
contents = """
%post
bootc switch --mutate-in-place --transport registry ghcr.io/c-bibek/chaulagain-os:@CHANNEL@
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]

disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
